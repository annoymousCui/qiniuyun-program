server:
  port: 8084

spring:
  application:
    name: ai-voice-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: qiniuyun_ai_voice${unique-name:}-service_common-message-execute_pg
    send-message-timeout: 2000
    retry-times-when-send-failed: 1
    retry-times-when-send-async-failed: 1

# 语音服务配置
voice:
  upload-dir: uploads/voice/
  output-dir: outputs/voice/
  # 语音识别API配置（可选）
  speech-api-url: 
  # TTS API配置（可选）
  tts-api-url: 

# 支持的音频格式
supported-audio-formats:
  - audio/wav
  - audio/mp3
  - audio/mpeg
  - audio/ogg
  - audio/webm

management:
  endpoints:
    web:
      exposure:
        include: "*"
