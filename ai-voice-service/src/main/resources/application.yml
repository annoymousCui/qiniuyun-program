server:
  port: 8084

spring:
  application:
    name: ai-voice-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 语音服务配置
voice:
  upload-dir: uploads/voice/
  output-dir: outputs/voice/
  # 语音识别API配置（可选）
  speech-api-url: 
  # TTS API配置（可选）
  tts-api-url: 

# 支持的音频格式
supported-audio-formats:
  - audio/wav
  - audio/mp3
  - audio/mpeg
  - audio/ogg
  - audio/webm

management:
  endpoints:
    web:
      exposure:
        include: "*"
