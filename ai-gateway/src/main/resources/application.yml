server:
  port: 8080

spring:
  application:
    name: ai-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      routes:
        - id: user-service
          uri: lb://ai-user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2
        - id: character-service
          uri: lb://ai-character-service
          predicates:
            - Path=/api/character/**
          filters:
            - StripPrefix=2
        - id: chat-service
          uri: lb://ai-chat-service
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=2
        - id: voice-service
          uri: lb://ai-voice-service
          predicates:
            - Path=/api/voice/**
          filters:
            - StripPrefix=2
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
