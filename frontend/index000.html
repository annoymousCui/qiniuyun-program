<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI角色扮演平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .auth-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
        }
        
        .auth-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            background: #f5f5f5;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        
        .auth-tab.active {
            background: #667eea;
            color: white;
        }
        
        .auth-form {
            display: none;
        }
        
        .auth-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #5a6fd8;
        }
        
        .main-content {
            display: none;
        }
        
        .main-content.active {
            display: block;
        }
        
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .character-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .character-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .character-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: block;
        }
        
        .character-name {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
        
        .character-description {
            color: #666;
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        .character-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
        }
        
        .tag {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        
        .chat-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: none;
        }
        
        .chat-section.active {
            display: block;
        }
        
        .chat-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .chat-character-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
        }
        
        .chat-character-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }
        
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: #667eea;
            color: white;
        }
        
        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
        }
        
        .chat-input {
            display: flex;
            gap: 10px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
        }
        
        .chat-input button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .chat-input button:hover {
            background: #5a6fd8;
        }
        
        .voice-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
        }
        
        .voice-btn {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .voice-btn:hover {
            background: #45a049;
        }
        
        .voice-btn.recording {
            background: #f44336;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .search-section {
            margin-bottom: 30px;
        }
        
        .search-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 1.1rem;
            text-align: center;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .logout-btn:hover {
            background: #d32f2f;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🎭 AI角色扮演平台</h1>
            <p>与历史名人、文学角色进行智能对话，体验沉浸式角色扮演</p>
        </div>
        
        <!-- 认证区域 -->
        <div class="auth-section" id="authSection">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">登录</button>
                <button class="auth-tab" onclick="switchTab('register')">注册</button>
            </div>
            
            <div class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">用户名</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码">
                </div>
                <button class="btn" onclick="login()">登录</button>
            </div>
            
            <div class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="registerUsername">用户名</label>
                    <input type="text" id="registerUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="registerEmail">邮箱</label>
                    <input type="email" id="registerEmail" placeholder="请输入邮箱">
                </div>
                <div class="form-group">
                    <label for="registerPassword">密码</label>
                    <input type="password" id="registerPassword" placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label for="registerNickname">昵称</label>
                    <input type="text" id="registerNickname" placeholder="请输入昵称">
                </div>
                <button class="btn" onclick="register()">注册</button>
            </div>
        </div>
        
        <!-- 主要内容区域 -->
        <div class="main-content" id="mainContent">
            <button class="logout-btn" onclick="logout()">退出登录</button>
            
            <!-- 搜索区域 -->
            <div class="search-section">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索角色...">
            </div>
            
            <!-- 角色网格 -->
            <div class="character-grid" id="characterGrid">
                <!-- 角色卡片将通过JavaScript动态加载 -->
            </div>
            
            <!-- 聊天区域 -->
            <div class="chat-section" id="chatSection">
                <div class="chat-header">
                    <img class="chat-character-avatar" id="chatCharacterAvatar" src="" alt="">
                    <div class="chat-character-name" id="chatCharacterName"></div>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="输入消息...">
                    <button onclick="sendMessage()">发送</button>
                </div>
                <div class="voice-controls">
                    <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceRecording()">🎤 语音输入</button>
                    <button class="voice-btn" onclick="toggleVoiceOutput()">🔊 语音输出</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentCharacter = null;
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        
        // 切换认证标签
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelector('.auth-tab:first-child').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelector('.auth-tab:last-child').classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }
        
        // 登录
        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) {
                alert('请填写完整信息');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8080/api/user/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `username=${username}&password=${password}`
                });
                
                const result = await response.json();
                if (result.code === 200) {
                    currentUser = result.data.user;
                    localStorage.setItem('token', result.data.token);
                    showMainContent();
                    loadCharacters();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                alert('登录失败：' + error.message);
            }
        }
        
        // 注册
        async function register() {
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const nickname = document.getElementById('registerNickname').value;
            
            if (!username || !email || !password || !nickname) {
                alert('请填写完整信息');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8080/api/user/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        nickname
                    })
                });
                
                const result = await response.json();
                if (result.code === 200) {
                    currentUser = result.data.user;
                    localStorage.setItem('token', result.data.token);
                    showMainContent();
                    loadCharacters();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                alert('注册失败：' + error.message);
            }
        }
        
        // 显示主要内容
        function showMainContent() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('mainContent').classList.add('active');
        }
        
        // 加载角色列表
        async function loadCharacters() {
            try {
                const response = await fetch('http://localhost:8080/api/character/popular?limit=20');
                const result = await response.json();
                
                if (result.code === 200) {
                    displayCharacters(result.data);
                }
            } catch (error) {
                console.error('加载角色失败：', error);
            }
        }
        
        // 显示角色列表
        function displayCharacters(characters) {
            const grid = document.getElementById('characterGrid');
            grid.innerHTML = '';
            
            characters.forEach(character => {
                const card = document.createElement('div');
                card.className = 'character-card';
                card.onclick = () => startChat(character);
                
                card.innerHTML = `
                    <img class="character-avatar" src="${character.avatar}" alt="${character.name}">
                    <div class="character-name">${character.name}</div>
                    <div class="character-description">${character.description}</div>
                    <div class="character-tags">
                        ${character.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        // 开始聊天
        function startChat(character) {
            currentCharacter = character;
            document.getElementById('chatCharacterAvatar').src = character.avatar;
            document.getElementById('chatCharacterName').textContent = character.name;
            document.getElementById('chatSection').classList.add('active');
            document.getElementById('characterGrid').style.display = 'none';
            loadChatHistory();
        }
        
        // 加载聊天历史
        async function loadChatHistory() {
            if (!currentCharacter) return;
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`http://localhost:8080/api/chat/history?characterId=${currentCharacter.id}`, {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                
                const result = await response.json();
                if (result.code === 200) {
                    displayMessages(result.data);
                }
            } catch (error) {
                console.error('加载聊天历史失败：', error);
            }
        }
        
        // 显示消息
        function displayMessages(messages) {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            
            messages.forEach(message => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${message.role}`;
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = message.content;
                
                messageDiv.appendChild(contentDiv);
                container.appendChild(messageDiv);
            });
            
            container.scrollTop = container.scrollHeight;
        }
        
        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content || !currentCharacter) return;
            
            // 显示用户消息
            addMessageToChat('user', content);
            input.value = '';
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('http://localhost:8080/api/chat/send', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `characterId=${currentCharacter.id}&content=${encodeURIComponent(content)}`
                });
                
                const result = await response.json();
                if (result.code === 200) {
                    addMessageToChat('assistant', result.data.content);
                } else {
                    addMessageToChat('assistant', '抱歉，我现在无法回复您的消息。');
                }
            } catch (error) {
                addMessageToChat('assistant', '网络错误，请稍后重试。');
            }
        }
        
        // 添加消息到聊天界面
        function addMessageToChat(role, content) {
            const container = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(contentDiv);
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }
        
        // 切换语音录制
        async function toggleVoiceRecording() {
            const btn = document.getElementById('voiceBtn');
            
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };
                    
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        await sendVoiceMessage(audioBlob);
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    btn.textContent = '🛑 停止录制';
                    btn.classList.add('recording');
                } catch (error) {
                    alert('无法访问麦克风：' + error.message);
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.textContent = '🎤 语音输入';
                btn.classList.remove('recording');
            }
        }
        
        // 发送语音消息
        async function sendVoiceMessage(audioBlob) {
            try {
                const formData = new FormData();
                formData.append('file', audioBlob, 'voice.wav');
                
                const response = await fetch('http://localhost:8080/api/voice/speech-to-text', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                if (result.code === 200) {
                    document.getElementById('messageInput').value = result.data.text;
                    sendMessage();
                }
            } catch (error) {
                console.error('语音识别失败：', error);
            }
        }
        
        // 切换语音输出
        function toggleVoiceOutput() {
            // 这里可以实现文字转语音功能
            alert('语音输出功能开发中...');
        }
        
        // 退出登录
        function logout() {
            currentUser = null;
            currentCharacter = null;
            localStorage.removeItem('token');
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('mainContent').classList.remove('active');
            document.getElementById('chatSection').classList.remove('active');
            document.getElementById('characterGrid').style.display = 'grid';
        }
        
        // 搜索功能
        document.getElementById('searchInput').addEventListener('input', async function(e) {
            const keyword = e.target.value;
            if (keyword.length > 2) {
                try {
                    const response = await fetch(`http://localhost:8080/api/character/search?keyword=${encodeURIComponent(keyword)}`);
                    const result = await response.json();
                    if (result.code === 200) {
                        displayCharacters(result.data);
                    }
                } catch (error) {
                    console.error('搜索失败：', error);
                }
            } else if (keyword.length === 0) {
                loadCharacters();
            }
        });
        
        // 回车发送消息
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // 检查登录状态
        window.addEventListener('load', function() {
            const token = localStorage.getItem('token');
            if (token) {
                // 验证token有效性
                fetch('http://localhost:8080/api/user/info', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                })
                .then(response => response.json())
                .then(result => {
                    if (result.code === 200) {
                        currentUser = result.data;
                        showMainContent();
                        loadCharacters();
                    }
                })
                .catch(() => {
                    localStorage.removeItem('token');
                });
            }
        });
    </script>
</body>
</html>
